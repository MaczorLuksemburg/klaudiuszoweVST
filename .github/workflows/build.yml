name: Build plugins

on:
  push:
    branches: [main]
    tags: ['v*']   # a version tag also publishes a GitHub Release (see the release job)
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022 # has Visual Studio 2022, matching local builds
            configure: -G "Visual Studio 17 2022" -A x64
          - name: macOS
            os: macos-latest
            configure: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: Linux
            os: ubuntu-22.04
            configure: -DCMAKE_BUILD_TYPE=Release

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # JUCE's docs/Linux Dependencies.md, minus curl and webkit (both disabled).
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev libegl-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      # Logic Pro only loads AUs that pass Apple's validator, so run it on every build.
      - name: Validate Audio Units (auval)
        if: runner.os == 'macOS'
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          units=$(auval -a | awk '$3 == "Klau" { print $1, $2, $3 }')
          if [ -z "$units" ]; then echo "No Maki plugins AUs registered"; auval -a; exit 1; fi
          failed=0
          while read -r type subtype manufacturer; do
            auval -v "$type" "$subtype" "$manufacturer" || failed=1
          done <<< "$units"
          exit $failed

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p MakiPlugins
          find build/plugins -maxdepth 5 -path '*_artefacts/Release/*' \( -name '*.vst3' -o -name '*.component' \) -prune             -exec cp -R {} MakiPlugins/ \;
          cp docs/INSTALL.md MakiPlugins/INSTALL.md
          cp LICENSE MakiPlugins/LICENSE.txt
          ls -la MakiPlugins

      # One zip per system with a MakiPlugins/ folder inside. On macOS, ditto keeps the bundles'
      # permissions and code signatures intact (a plain artifact upload can drop them).
      - name: Package zip
        shell: bash
        run: |
          zip_name="MakiPlugins-${{ matrix.name }}.zip"
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent MakiPlugins "$zip_name"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$zip_name" MakiPlugins
          else
            zip -qr "$zip_name" MakiPlugins
          fi
          ls -la "$zip_name"

      - uses: actions/upload-artifact@v4
        with:
          name: MakiPlugins-${{ matrix.name }}
          path: MakiPlugins/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: MakiPlugins-${{ matrix.name }}.zip
          retention-days: 14

  # Runs only for version tags (e.g. v1.0.0): publishes the three zips on a public release page,
  # downloadable without a GitHub account, with docs/INSTALL.md as the release notes.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/*.zip             --title "Maki plugins $GITHUB_REF_NAME"             --notes-file docs/INSTALL.md
